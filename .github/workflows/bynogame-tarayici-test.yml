
name: ByNoGame Tarayici Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Playwright kurulumu
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: ByNoGame sayfasini incele
        run: |
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          URL = "https://www.bynogame.com/tr/oyunlar/knight-online/gold-bar"

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page(
                      locale="tr-TR",
                      viewport={"width": 1366, "height": 768}
                  )

                  response = await page.goto(
                      URL,
                      wait_until="domcontentloaded",
                      timeout=45000
                  )

                  print("HTTP STATUS:", response.status if response else "YOK")
                  print("SAYFA BASLIGI:", await page.title())

                  try:
                      await page.locator("article.itemDiv").first.wait_for(
                          timeout=10000
                      )
                  except Exception:
                      pass

                  products = page.locator("article.itemDiv")
                  count = await products.count()

                  print("BULUNAN URUN:", count)

                  for i in range(min(count, 12)):
                      product = products.nth(i)

                      name = await product.locator(
                          "[ins-product-name]"
                      ).first.get_attribute("ins-product-name")

                      price = await product.locator(
                          "[ins-product-price]"
                      ).first.get_attribute("ins-product-price")

                      print("SUNUCU:", name, "| FIYAT:", price)

                  await browser.close()

          asyncio.run(main())
          PY
