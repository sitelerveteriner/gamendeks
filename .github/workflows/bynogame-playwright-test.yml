
name: ByNoGame Playwright Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright kurulumu
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: ByNoGame tarayici testi
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          url = "https://www.bynogame.com/tr/oyunlar/knight-online/gold-bar"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1366, "height": 768}
              )

              try:
                  response = page.goto(
                      url,
                      wait_until="domcontentloaded",
                      timeout=30000
                  )

                  page.wait_for_timeout(5000)

                  print("HTTP STATUS:",
                        response.status if response else "YOK")
                  print("SON URL:", page.url)
                  print("SAYFA BASLIGI:", page.title())

                  body = page.locator("body").inner_text(
                      timeout=10000
                  )

                  print("METIN UZUNLUGU:", len(body))
                  print("SAYFA METNI:")
                  print(body[:2000])

                  print("URUN SAYISI:",
                        page.locator("article.itemDiv").count())

              except Exception as e:
                  print("HATA:", type(e).__name__, str(e))

              finally:
                  browser.close()
          PY
