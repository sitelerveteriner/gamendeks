name: Gamendeks SSH Testi

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: ubuntu-latest
    steps:
      - name: VPS baglanti testi
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 178.105.50.234 >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes root@178.105.50.234 \
            'echo "SSH BAGLANTISI BASARILI" && systemctl is-active gamendeks'
