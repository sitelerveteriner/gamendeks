name: GameST Parser Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlari indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutuphaneyi kur
        run: pip install beautifulsoup4

      - name: Kopazar parser testini calistir
        run: python kopazar_parser.py
