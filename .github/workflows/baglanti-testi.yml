name: GameST Baglanti Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Kopazar ve ByNoGame testi
        run: |
          for url in \
            "https://www.kopazar.com/knight-online-gold-bar" \
            "https://www.bynogame.com/tr/oyunlar/knight-online/gold-bar"
          do
            echo "TEST: $url"
            curl -L -s -o /dev/null -w "HTTP: %{http_code}\n" --max-time 20 "$url"
          done
