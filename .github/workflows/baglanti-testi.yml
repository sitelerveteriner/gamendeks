name: GameST Baglanti Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baglantilari kontrol et
        shell: bash
        run: |
          echo "## GameST Baglanti Sonuclari" >> "$GITHUB_STEP_SUMMARY"
          echo "| Site | HTTP Kodu |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for site in Kopazar ByNoGame; do
            if [ "$site" = "Kopazar" ]; then
              url="https://www.kopazar.com/knight-online-gold-bar"
            else
              url="https://www.bynogame.com/tr/oyunlar/knight-online/gold-bar"
            fi

            code=$(curl -L -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            echo "| $site | $code |" >> "$GITHUB_STEP_SUMMARY"
          done
